<div class="flex items-start justify-center h-screen pt-50 bg-gray-100">
    <div class="grid grid-cols-1 md:grid-cols-2 w-3/5 shadow-[0_10px_30px_rgba(0,0,0,0.3)]">
        <div class="bg-[#0A7C6E] text-white p-10 rounded-l-lg hidden md:block">
            <div class="container pt-10">
                <p class="text-3xl font-bold text-center mb-6">Voting System</p>
                <p class="text-center">Secure and transparent voting platform.</p>

                <div class="flex items-center justify-center ">
                    <div class="text-left mt-8 space-y-1">
                        <p>✔ Verified voter registration</p>
                        <p>✔ One person, one vote</p>
                        <p>✔ Secure authentication</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="bg-[#FAFAFA] p-7 rounded-lg">

            <div class="header-container">
                <p class="text-black font-bold text-2xl">Login</p>
                <p class="text-gray-500 mt-2">Access your account</p>
            </div>

            <div class="login-form mt-7">
                 <form action="">
                    <input type="text" placeholder="Username" class="border border-gray-300 p-2 rounded w-full mb-6
                    focus:border-[#0A7C6E] focus:outline-none "/>
                    <input type="password" placeholder="Password" class="border border-gray-300 p-2 rounded w-full
                    focus:border-[#0A7C6E] focus:outline-none "/>

                    <button type="submit" class="bg-[#F59E0B] p-2 rounded w-full text-white mt-6 cursor-pointer hover:bg-[#D97706]">
                        Login
                    </button>
                </form>
            </div>

            <div class="flex items-center justify-center register-container gap-1 mt-6">
                <p class="text-gray-500">Don't have an account ? </p> 
                <a routerLink="/register" class="text-blue-500 cursor-pointer hover:text-blue-800">Register</a>
            </div>

        </div>
    </div>
</div>
