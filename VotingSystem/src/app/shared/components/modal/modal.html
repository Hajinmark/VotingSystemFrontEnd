@if (this.isOpen && (this.currentModal === 'Insert_Election_Modal' || this.currentModal === 'Update_Election_Modal' || this.currentModal === 'Delete_Election_Modal'))
{
    <div class="modal-form fixed inset-0 z-50 flex justify-center items-start pt-20 bg-black/50 px-4">
        <div class="form-container bg-white rounded-lg shadow-md w-1/3 p-4">
            <header class=" text-black rounded-t-lg flex justify-between items-center">
                <div>
                    <h1 class="text-3xl font-bold">{{this.modalTitle}}</h1>
                </div>

                <div>
                    <button class="cursor-pointer" (click)="this.closeModal()">
                        <i class="fas fa-xmark"></i>
                    </button>
                </div>
                
            </header>

            <div class="modal-description">
                <p class="text-gray-600">{{this.modalDescription}}</p>
            </div>

            <body>
                <ng-content></ng-content>
            </body>

           <footer class="mt-6">
                <div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-3 sm:gap-4">

                    <button
                        type="button"
                        class="w-full sm:w-auto bg-gray-300 hover:opacity-75 text-shadow-black font-bold py-2 px-4 rounded cursor-pointer"
                        (click)="closeModal()">
                        Cancel
                    </button>

                    <button (click)="submitModal()"
                        type="submit"
                        class="w-full sm:w-auto hover:opacity-75 text-white font-bold py-2 px-4 rounded cursor-pointer"
                        [ngClass]="currentModal === 'Delete_Election_Modal' ? 'bg-red-600' : 'bg-[#0a7c6e]'">

                        <span>{{ currentModal === 'Delete_Election_Modal' ? 'Delete' : 'Save' }}</span>
                    </button>

                </div>
            </footer>
        </div>
    </div>
}
